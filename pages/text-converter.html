<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://unpkg.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net blob: data:; script-src 'self' 'unsafe-eval' https://unpkg.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://cdnjs.cloudflare.com https://unpkg.com data: https://fonts.gstatic.com; worker-src 'self' blob: https://cdnjs.cloudflare.com;">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#f97316">
    <title>Business tools | Editor de Texto</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        html, body { 
            height: 100%; 
            margin: 0; 
            overflow: hidden; 
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            /* overflow: hidden; Removed to allow dropdowns to display */
            padding-top: 30px; /* Increased by ~20px (0.5cm) */
        }
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0; /* Important for flex child scroll */
        }
        .editor-card {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .editor-body {
            flex: 1;
            min-height: 0; 
        }
        .full-height-editor {
            height: 100% !important;
            resize: none;
            border-radius: 0 0 12px 12px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg fixed-top">
            <div class="container-fluid px-4">
                <a class="navbar-brand" href="../index.html">
                    <img src="../assets/logo.png" alt="Business tools Logo">
                    Business tools
                </a>
                
                <div class="d-flex align-items-center gap-3">
                    <!-- Theme Toggle -->
                    <div class="theme-toggle" @click="toggleTheme" title="Alternar Tema">
                        <i class="fas" :class="isDark ? 'fa-sun' : 'fa-moon'"></i>
                    </div>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" @click.prevent.stop="toggleNav" :class="{ 'show': isNavOpen }" :aria-expanded="isNavOpen">
                            Menu
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" :class="{ 'show': isNavOpen }" style="right: 0; left: auto;">
                            <li><a class="dropdown-item" href="../index.html">Início</a></li>
                            <li><a class="dropdown-item active" href="text-converter.html">Editor de Texto</a></li>
                            <li><a class="dropdown-item" href="pdf-tools.html">Ferramentas PDF</a></li>
                            <li><a class="dropdown-item" href="flowchart.html">Fluxograma BPMN</a></li>
                        </ul>
                    </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="main-content container-fluid px-4">
            <div class="editor-container gap-4 pb-3">
                <h2 class="h4 m-0"><i class="fas fa-pen-nib text-primary me-2"></i>Editor e Conversor de Texto</h2>
                
                <!-- Toolbar -->
                <div style="position: relative; z-index: 100;">
                    <div class="card p-3 no-hover">
                        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center">
                            <!-- Transformations -->
                            <div class="btn-group flex-wrap" role="group">
                                <button class="btn btn-outline-secondary" @click="transform('upper')" title="MAIÚSCULAS">
                                    <i class="fas fa-font"></i> AA
                                </button>
                                <button class="btn btn-outline-secondary" @click="transform('lower')" title="Todas minúsculas">
                                    <i class="fas fa-font" style="font-size: 0.8em;"></i> aa
                                </button>
                                <button class="btn btn-outline-secondary" @click="transform('title')" title="Title Case">
                                    <i class="fas fa-heading"></i> Title
                                </button>
                                <button class="btn btn-outline-secondary" @click="transform('alternating')" title="Alternado">
                                    <i class="fas fa-random"></i> aLtEr
                                </button>
                                <button class="btn btn-outline-secondary" @click="transform('sentence')" title="Formato de frase">
                                    <i class="fas fa-text-height"></i> Aa
                                </button>
                                <button class="btn btn-outline-secondary" @click="transform('nolinebreak')" title="Remover quebras de linha">
                                    <i class="fas fa-level-up-alt fa-rotate-90"></i> Sem Quebras
                                </button>
                                <button class="btn btn-outline-secondary" @click="transform('cnj')" title="Formatar Processo CNJ (11 dígitos -> 20 dígitos)">
                                    <i class="fas fa-gavel"></i> Proc. CNJ
                                </button>
                                <button class="btn btn-outline-secondary" @click="toggleSpellCheck" :class="{ 'active': spellCheckEnabled }" title="Corretor Ortográfico">
                                    <i class="fas fa-check-double"></i> Corretor
                                </button>
                            </div>

                            <!-- Stats -->
                            <div class="text-muted small">
                                <span>{{ wordCount }} palavras</span> | 
                                <span>{{ charCount }} caracteres</span>
                            </div>

                            <!-- Export Actions -->
                            <div class="dropdown">
                                <button class="btn btn-primary dropdown-toggle" type="button" @click.stop="toggleExportMenu">
                                    <i class="fas fa-download me-2"></i>Exportar
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end" :class="{ 'show': showExportMenu }" style="position: absolute; right: 0; left: auto;">
                                    <li><a class="dropdown-item" href="#" @click.prevent="copyToClipboard"><i class="fas fa-copy me-2"></i>Copiar</a></li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li><a class="dropdown-item" href="#" @click.prevent="downloadPDF"><i class="fas fa-file-pdf me-2"></i>PDF</a></li>
                                    <li><a class="dropdown-item" href="#" @click.prevent="downloadDoc"><i class="fas fa-file-word me-2"></i>DOC</a></li>
                                    <li><a class="dropdown-item" href="#" @click.prevent="downloadTxt"><i class="fas fa-file-alt me-2"></i>TXT</a></li>
                                    <li><a class="dropdown-item" href="#" @click.prevent="downloadJson"><i class="fas fa-code me-2"></i>JSON</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Editor Area -->
                <div class="editor-card">
                    <div class="card h-100 no-hover">
                        <div class="card-header bg-transparent d-flex justify-content-between align-items-center py-2">
                            <span class="fw-bold">Editor</span>
                            <button class="btn btn-sm btn-link text-muted" @click="clearText">Limpar</button>
                        </div>
                        <div class="card-body p-0 editor-body">
                            <div
                                ref="editor"
                                class="form-control border-0 full-height-editor p-3" 
                                contenteditable="true"
                                @input="handleInput"
                                @paste="handlePaste"
                                :spellcheck="spellCheckEnabled"
                                style="outline: none; overflow-y: auto;"
                            ></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="text-center py-2 text-muted border-top bg-body">
            <small>&copy; 2026 Business tools. Excelência em Gestão.</small>
        </footer>
    </div>

    <script src="../js/text-converter.js"></script>
    <script src="../js/security.js"></script>
    <script src="../js/pwa.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
